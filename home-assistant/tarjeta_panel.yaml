# Tarjeta para el panel: Editar panel → Añadir tarjeta → Manual → pega esto
type: markdown
title: Comidas
content: >
  **Hoy** · {{ states('sensor.cena_de_hoy') }}
  {% if state_attr('sensor.cena_de_hoy','comida') %}<br><small>Comida adultos: {{ state_attr('sensor.cena_de_hoy','comida') }}</small>{% endif %}
  {% if state_attr('sensor.cena_de_hoy','cole') %}<br><small>Cole: {{ state_attr('sensor.cena_de_hoy','cole') }}</small>{% endif %}


  **Mañana** · {{ states('sensor.cena_de_manana') }}
  {% set dc = state_attr('sensor.cena_de_manana','descongelar') %}{% if dc %}<br><small>🧊 Sacar del congelador: {{ dc | join(', ') }}</small>{% endif %}
